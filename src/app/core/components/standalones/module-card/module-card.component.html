<div (click)="enterModule(info.id)" class="module-card shadow-sm mb-4 cursor-pointer bg-white">
  <div class="card-header-custom p-3 bg-secondary">
    <div class="d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-3">
        <div class="icon-container bg-white-transparent shadow-sm">
          <mat-icon class="text-white" fontIcon="account_box"></mat-icon>
        </div>
        <div>
          <h3 class="text-white mb-0 fw-bold">{{ info.customerName | slice:0:20 }}{{ info.customerName.length > 20 ? '...' : '' }}</h3>
        </div>
      </div>
      
      <div class="text-end">
        <p class="mb-0 text-white-50 x-small text-uppercase fw-bold">Scadenza</p>
        <p class="mb-0 text-white fw-medium" [class.opacity-50]="!deliveryDate">
            {{ deliveryDate || 'non inserita' }}
        </p>
      </div>
    </div>
  </div>

  <div class="card-body-custom p-3 bg-white">
    <div class="row g-3 mb-3">
      <div class="col-6">
        <div class="d-flex align-items-center gap-2 info-item">
          <mat-icon class="text-secondary opacity-75" fontIcon="perm_contact_calendar"></mat-icon>
          <div class="d-flex align-items-center overflow-hidden">
            <span class="text-truncate small fw-medium">{{info.studio.name}}</span>
            <app-colored-circle class="ms-1" [shadow]="true" [value]="info.studio.color" />
          </div>
        </div>
      </div>
      
      <div class="col-6 border-start">
        <div class="d-flex align-items-center gap-2 info-item ps-2">
          <mat-icon class="text-secondary opacity-75" fontIcon="edit_calendar"></mat-icon>
          <span class="small text-muted">{{prescriptionDate}}</span>
        </div>
      </div>
    </div>

    <div class="description-box mt-2">
      <p class="mb-0 text-muted small italic"  [class.opacity-50]="!info.description">
        {{ info.description || 'Nessuna descrizione presente.' }}
      </p>
    </div>
  </div>
</div>
